# 仓库暂无 pyproject.toml，使用独立 Ruff 配置；目标版本按存量兼容默认 py39
target-version = "py39"
line-length = 100

[lint]
# 存量仓库默认只开错误类规则；按基线预检结果收紧
select = ["E", "F", "I"]
# 中文/全角标点注释仓库：RUF001/002/003 会把「，」等判为模糊字符，属误报；
# 后续把 "RUF" 加回 select 时必须保留这三条 ignore
# 存量模式豁免（均有理由，清理 PR 收敛后再收紧）：
# F403/F405：历史代码大量使用 from x import *，无法静态确认名称，属既有模式
# E402：工具类脚本在 sys.path 调整后才 import，属常见写法
ignore = ["E501", "E402", "F403", "F405", "RUF001", "RUF002", "RUF003"]

# 收紧路径：清理 PR 后按阶段加回 B → UP/SIM → RUF（规则分批启用）
# per-file-ignores = { "legacy_*.py" = ["E402"] }   # 存量不可避免项按文件豁免并附理由
